                                {book.rating > 0 && (
                                    <div style={{ marginBottom: '1rem' }}>
                                        <span style={{ 
                                            background: '#FFE4E1', 
                                            color: '#FF69B4', 
                                            padding: '0.25rem 0.75rem', 
                                            borderRadius: '20px',
                                            fontSize: '0.85rem',
                                            fontWeight: 'bold'
                                        }}>
                                            ⭐ {book.rating}/10
                                        </span>
                                    </div>
                                )}
                                {book.recommendationReason && (
                                    <div style={{
                                        marginTop: '1rem',
                                        padding: '1rem',
                                        background: 'linear-gradient(135deg, #FFF5E6 0%, #FFE4E1 100%)',
                                        borderRadius: '10px',
                                        border: '1px solid #FFB6C1',
                                        fontSize: '0.9rem',
                                        lineHeight: '1.6'
                                    }}>
                                        <div style={{
                                            fontSize: '0.75rem',
                                            color: '#FF69B4',
                                            fontWeight: 'bold',
                                            marginBottom: '0.5rem'
                                        }}>
                                            💝 우리아이에게 추천하는 이유
                                        </div>
                                        <div>{book.recommendationReason}</div>
                                    </div>
                                )}
                            </div>
                        </div>

                        {book.description && (
                            <div style={{
                                marginBottom: '1.5rem',
                                padding: '1rem',
                                background: '#F8F9FA',
                                borderRadius: '10px',
                                lineHeight: '1.6',
                                fontSize: '0.9rem',
                                color: '#333'
                            }}>
                                <strong style={{ display: 'block', marginBottom: '0.5rem', color: '#FF69B4' }}>
                                    📖 책 소개
                                </strong>
                                <div style={{ whiteSpace: 'pre-wrap' }}>
                                    {book.description}
                                </div>
                            </div>
                        )}

                        <div style={{ display: 'flex', gap: '1rem', flexDirection: 'column' }}>
                            <div style={{ display: 'flex', gap: '1rem' }}>
                                <button
                                    onClick={handleAdd}
                                    disabled={adding}
                                    style={{
                                        flex: 1,
                                        padding: '0.75rem',
                                        background: adding ? '#ccc' : '#98D8C8',
                                        border: 'none',
                                        borderRadius: '10px',
                                        color: 'white',
                                        fontSize: '1rem',
                                        fontWeight: 'bold',
                                        cursor: adding ? 'not-allowed' : 'pointer'
                                    }}
                                >
                                    {adding ? '⏳ 추가 중...' : '➕ 책 추가하기'}
                                </button>
                            </div>
                            <button
                                onClick={handleAddToInterested}
                                disabled={addingToInterested}
                                style={{
                                    width: '100%',
                                    padding: '0.75rem',
                                    background: addingToInterested ? '#ccc' : '#DDA0DD',
                                    border: 'none',
                                    borderRadius: '10px',
                                    color: 'white',
                                    fontSize: '1rem',
                                    fontWeight: 'bold',
                                    cursor: addingToInterested ? 'not-allowed' : 'pointer'
                                }}
                            >
                                {addingToInterested ? '⏳ 추가 중...' : '💡 관심책으로 추가하기'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
